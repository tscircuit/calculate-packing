ccwRotationOffset: 0.0°" data-x="0" data-y="0" x="39.99999999999997" y="415.8794435857805" width="87.93817619783619" height="32.976816074188605" fill="rgba(0,0,0,0.25)" stroke="black" stroke-width="0.018194600674915636"/></g><g><rect data-type="rect" data-label="pcb_smtpad_18 connectivity_net2" data-x="0.5" data-y="0" x="94.96136012364758" y="415.8794435857805" width="32.97681607418858" height="32.976816074188605" fill="rgba(255,0,0,0.8)" stroke="black" stroke-width="0.018194600674915636"/></g><g><rect data-type="rect" data-label="pcb_smtpad_19 connectivity_net3" data-x="-0.5" data-y="0" x="39.99999999999997" y="415.8794435857805" width="32.97681607418858" height="32.976816074188605" fill="rgba(255,0,0,0.8)" stroke="black" stroke-width="0.018194600674915636"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":54.96136012364761,"c":0,"e":83.96908809891806,"b":0,"d":-54.96136012364761,"f":432.3678516228748};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script>
