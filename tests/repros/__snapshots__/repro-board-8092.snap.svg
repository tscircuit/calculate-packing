="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="1.905" data-y="5.790313999999947" x="356.40006944" y="170.75290592000118" width="12.543861120000031" height="39.088120960000026" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="3.175" data-y="5.790313999999947" x="384.84806944" y="170.75290592000118" width="12.543861119999974" height="39.088120960000026" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="4.445" data-y="5.790313999999947" x="413.29606944" y="170.75290592000118" width="12.543861120000031" height="39.088120960000026" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="-4.445" data-y="11.535285999999948" x="214.16006943999997" y="42.06553312000119" width="12.543861120000031" height="39.08812096" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="-3.175" data-y="11.535285999999948" x="242.60806944" y="42.06553312000119" width="12.543861120000003" height="39.08812096" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="-1.905" data-y="11.535285999999948" x="271.05606944" y="42.06553312000119" width="12.543861120000031" height="39.08812096" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="-0.635" data-y="11.535285999999948" x="299.50406944" y="42.06553312000119" width="12.543861119999974" height="39.08812096" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="0.635" data-y="11.535285999999948" x="327.95206944" y="42.06553312000119" width="12.543861119999974" height="39.08812096" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="1.905" data-y="11.535285999999948" x="356.40006944" y="42.06553312000119" width="12.543861120000031" height="39.08812096" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="3.175" data-y="11.535285999999948" x="384.84806944" y="42.06553312000119" width="12.543861119999974" height="39.08812096" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="4.445" data-y="11.535285999999948" x="413.29606944" y="42.06553312000119" width="12.543861120000031" height="39.08812096" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="8.662799999999947" x="214.16006943999997" y="42.06553312000119" width="211.67986112000006" height="167.77549376000002" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.044642857142857144"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":22.4,"c":0,"e":320,"b":0,"d":-22.4,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>